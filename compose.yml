services:
  ytdl_material:
    build:
      context: .
    volumes:
      - appdata:/app/appdata
      - ./audio:/app/audio
      - ./video:/app/video
      - ./subscriptions:/app/subscriptions
      - ./users:/app/users
    ports:
      - "8998:17442"
    image: ghcr.io/lzpreslav/youtubedl-material:latest
volumes:
  appdata:
